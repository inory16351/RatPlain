<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쥐 해적선</title>
<style>
  body { margin:0; background:#04101a; color:#e8f0f8; font-family:"Malgun Gothic",system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:10px; }
  canvas { border:2px solid #3a2a18; border-radius:8px; max-width:100%; display:block; cursor:crosshair; }
  #help { font-size:12px; color:#8fa8c0; width:1100px; max-width:100%; margin-top:6px; line-height:1.6; }
</style>
</head>
<body>
<canvas id="c" width="1100" height="680"></canvas>
<div id="help">W/S = 돛 올리기·내리기 · A/D = 키 · 왼쪽 클릭(누르고 있으면 연사) = 마우스 쪽 뱃전 일제 사격 · Q/E = 왼쪽/오른쪽 뱃전 · Space = 양쪽 · 1 체인샷 · 2 화염탄 · 3 폭격(마우스 위치) · 물에 빠진 쥐를 건지면 선원 증가 · 보물상자·금화는 지나가며 획득</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = cv.width, VH = cv.height, WORLD = { w:3600, h:2600 };
const img = n => { const i = new Image(); i.src = 'assets/' + n + '.png'; return i; };
const IMG = Object.fromEntries(['ratface', 'rat_hero', 'cheese', 'cat_tuxedo', 'cat_ninja', 'cat_boss_commander', 'cat_boss_shark', 'cat_chonk', 'cat_fire'].map(n => [n, img(n)]));
function pic(n, x, y, s, rot = 0) {
  const i = IMG[n]; ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  if (!i.complete || !i.naturalWidth) { ctx.fillStyle = n.startsWith('cat') ? '#d9773a' : '#b08a6a'; ctx.beginPath(); ctx.arc(0, 0, s * 0.4, 0, 7); ctx.fill(); }
  else { const k = s / Math.max(i.naturalWidth, i.naturalHeight); ctx.drawImage(i, -i.naturalWidth * k / 2, -i.naturalHeight * k / 2, i.naturalWidth * k, i.naturalHeight * k); }
  ctx.restore();
}

// ── 효과음 (즉석 합성) ──
let AC = null;
function tone(f0, f1, dur, type = 'square', vol = 0.12, delay = 0) { if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02); }
function noise(dur, vol = 0.2, delay = 0, lp = 2400) { if (!AC) return; const t = AC.currentTime + delay, b = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2); const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; s.buffer = b; g.gain.value = vol; s.connect(f).connect(g).connect(AC.destination); s.start(t); }
const SFX = {
  boom: (n = 1, far = 0) => { for (let i = 0; i < Math.min(n, 5); i++) { noise(0.55, 0.32 * (1 - far), i * 0.045, 900); tone(95, 32, 0.45, 'sine', 0.32 * (1 - far), i * 0.045); } },
  splash: () => noise(0.3, 0.07, 0, 3000),
  hit: () => { noise(0.22, 0.25, 0, 1600); tone(170, 60, 0.18, 'square', 0.09); },
  crit: () => { noise(0.5, 0.4, 0, 1200); tone(240, 40, 0.5, 'sawtooth', 0.15); tone(60, 30, 0.6, 'sine', 0.4); },
  sink: () => { noise(1.4, 0.2, 0, 500); tone(200, 40, 1.3, 'sawtooth', 0.07); },
  coin: () => { tone(1200, 1200, 0.06, 'triangle', 0.07); tone(1800, 1800, 0.1, 'triangle', 0.07, 0.06); },
  chest: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.09, i * 0.06)),
  squeak: () => { tone(1500, 2300, 0.07, 'square', 0.05); tone(2200, 1400, 0.09, 'square', 0.05, 0.07); },
  chain: () => { for (let i = 0; i < 4; i++) tone(900 + i * 140, 500, 0.08, 'square', 0.05, i * 0.03); },
  fire: () => { noise(0.6, 0.12, 0, 600); tone(200, 90, 0.5, 'sawtooth', 0.05); },
  whistle: () => tone(1800, 500, 0.9, 'sine', 0.06),
  buy: () => [523, 659, 784].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.1, i * 0.07)),
  meow: () => { tone(700, 1100, 0.15, 'sawtooth', 0.05); tone(1100, 600, 0.25, 'sawtooth', 0.05, 0.15); },
  wave: () => [392, 523, 659, 784].forEach((f, i) => tone(f, f, 0.22, 'triangle', 0.12, i * 0.13)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.98, 0.3, 'sawtooth', 0.08, i * 0.2)),
  deny: () => tone(200, 150, 0.1, 'square', 0.06),
};

// ── 적 종류 ── hp · 길이 · 최고 속도 · 회전 · 공격 · 금화 · 선원 얼굴 · 돛 색
const FOES = {
  sloop:   { name:'고양이 해적선', hp:60,  len:72,  speed:105, turn:1.2, guns:2, reload:2.6, dmg:9,  gold:15, crew:'cat_tuxedo', sail:'#2b2b30', masts:1 },
  speeder: { name:'고양이 쾌속정', hp:28,  len:42,  speed:200, turn:2.8, ram:22, gold:8,  crew:'cat_ninja', sail:'#7a2a2a', masts:1 },
  shark:   { name:'상어',         hp:30,  len:44,  speed:175, turn:3.0, bite:8, gold:6 },
  mine:    { name:'떠다니는 폭탄통', hp:12, len:24,  speed:12,  turn:0,   boom:28, gold:3 },
  gunboat: { name:'고양이 포함',   hp:140, len:96,  speed:75,  turn:0.85, guns:3, reload:2.2, dmg:10, gold:30, crew:'cat_fire', sail:'#3a2a4a', masts:2 },
  mortar:  { name:'고양이 박격포선', hp:90, len:80,  speed:70,  turn:0.9, reload:3.4, dmg:18, gold:25, crew:'cat_chonk', sail:'#4a3a1a', masts:1, mortar:true },
  boss:    { name:'대장 고양이 갤리온', hp:900, len:180, speed:62, turn:0.55, guns:6, reload:2.0, dmg:12, gold:220, crew:'cat_boss_commander', sail:'#15151a', masts:3, boss:true },
};
function waveList(n) {
  const L = [], add = (k, c) => { for (let i = 0; i < c; i++) L.push(k); };
  add('sloop', 1 + Math.floor(n * 0.8)); add('speeder', Math.floor(n * 0.7)); add('shark', n >= 2 ? Math.floor(n / 2) : 0);
  add('mine', 2 + n); add('gunboat', n >= 3 ? Math.floor((n - 1) / 2) : 0); add('mortar', n >= 4 ? Math.floor((n - 2) / 2) : 0);
  if (n % 5 === 0) add('boss', 1);
  return L;
}
// 상점: 일반 강화 + 특수 포탄 해금
const UPGS = {
  guns:   { name:'대포 추가',  desc:'뱃전마다 대포 +1', max:5, cost:l => 40 + l * 45 },
  reload: { name:'빠른 장전',  desc:'재장전 -15%',     max:5, cost:l => 35 + l * 35 },
  power:  { name:'무거운 포탄', desc:'포탄 피해 +4 · 치명타 +3%', max:6, cost:l => 35 + l * 35 },
  range:  { name:'긴 포신',    desc:'사거리 +20%',     max:4, cost:l => 30 + l * 30 },
  hull:   { name:'철판 선체',  desc:'최대 체력 +30',   max:6, cost:l => 40 + l * 40 },
  sail:   { name:'큰 돛',      desc:'속도·회전 +12%',  max:4, cost:l => 30 + l * 35 },
  chain:  { name:'체인샷 해금', desc:'[1] 돛을 찢어 느리게', max:1, cost:() => 60 },
  fireb:  { name:'화염탄 해금', desc:'[2] 맞은 배가 불탐',  max:1, cost:() => 80 },
  mortar: { name:'폭격 해금',   desc:'[3] 마우스 위치 광역 폭발', max:1, cost:() => 100 },
};
const SKILLS = { chain:{ key:'1', name:'체인샷', cd:9 }, fireb:{ key:'2', name:'화염탄', cd:11 }, mortar:{ key:'3', name:'폭격', cd:14 } };

// ── 상태 ──
let G, keys = {}, mouse = { x:VW/2, y:VH/2, down:false }, cam = { x:0, y:0 }, shakeAmt = 0, kick = { x:0, y:0 }, timeScale = 1, hitStop = 0, slowMo = 0;
function newGame() {
  G = { t:0, wave:0, gold:0, up:Object.fromEntries(Object.keys(UPGS).map(k => [k, 0])), foes:[], balls:[], shells:[], parts:[], coins:[], fx:[], islands:[], swimmers:[], chests:[], clouds:[], shop:false, over:false, msg:null, kills:0, combo:0, comboT:0, best:0 };
  for (let i = 0; i < 9; i++) { let x, y, r; do { x = 300 + Math.random() * (WORLD.w - 600); y = 300 + Math.random() * (WORLD.h - 600); r = 70 + Math.random() * 110; } while (Math.hypot(x - WORLD.w/2, y - WORLD.h/2) < 450 || G.islands.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 120)); G.islands.push({ x, y, r, seed:Math.random() * 100 }); }
  for (let i = 0; i < 8; i++) G.clouds.push({ x:Math.random() * WORLD.w, y:Math.random() * WORLD.h, r:200 + Math.random() * 250 });
  G.me = { x:WORLD.w/2, y:WORLD.h/2, a:-Math.PI/2, v:0, av:0, sail:0.4, hp:100, max:100, cd:[0, 0], len:84, hit:0, recoil:[0, 0], crew:0, sk:{ chain:0, fireb:0, mortar:0 }, masts:2 };
  nextWave();
}
const stat = { guns:() => 3 + G.up.guns, reload:() => 2.0 * Math.pow(0.85, G.up.reload) * (1 - Math.min(20, G.me.crew) * 0.02), dmg:() => 15 + G.up.power * 4, crit:() => 0.12 + G.up.power * 0.03, range:() => 1 + G.up.range * 0.2, speed:() => 220 * (1 + G.up.sail * 0.12), turn:() => 1.55 * (1 + G.up.sail * 0.12) };
function nextWave() {
  G.wave++; G.shop = false;
  for (const k of waveList(G.wave)) spawnFoe(k);
  for (let i = 0; i < 1 + Math.floor(G.wave / 3); i++) spawnChest();
  G.msg = { text: G.wave % 5 === 0 ? `웨이브 ${G.wave} · 대장 고양이 갤리온 출현!` : `웨이브 ${G.wave}`, sub: G.wave === 1 ? '고양이 해적들이 쥐 선원들을 납치했다! 구해 내라!' : '', t:2.6 };
  SFX.wave(); if (G.wave % 5 === 0) SFX.meow();
}
function freeSpot(minD, maxD) { let x, y; do { const a = Math.random() * Math.PI * 2, d = minD + Math.random() * (maxD - minD); x = G.me.x + Math.cos(a) * d; y = G.me.y + Math.sin(a) * d; } while (x < 80 || y < 80 || x > WORLD.w - 80 || y > WORLD.h - 80 || G.islands.some(o => Math.hypot(o.x - x, o.y - y) < o.r + 70)); return { x, y }; }
function spawnFoe(k) {
  const F = FOES[k], p = freeSpot(700, 1300), hp = F.hp * (1 + (G.wave - 1) * 0.08);
  G.foes.push({ k, ...F, ...p, a:Math.random() * 7, v:0, av:0, hp, max:hp, cd:[Math.random() * 2, Math.random() * 2, 2], hit:0, bob:Math.random() * 7, recoil:[0, 0], burn:0, slow:0, phase:0 });
}
function spawnChest() { const p = freeSpot(300, 1200); G.chests.push({ ...p, gold:30 + Math.floor(Math.random() * 30) + G.wave * 5, bob:Math.random() * 7 }); }

// ── 사격 ──
// side: +1 = 오른쪽 뱃전, -1 = 왼쪽 뱃전. kind: 'ball' 보통 · 'chain' 체인샷 · 'fire' 화염탄
function broadside(ship, side, count, dmg, speed, life, foe, kind = 'ball') {
  const fx = Math.cos(ship.a), fy = Math.sin(ship.a), nx = -fy * side, ny = fx * side;
  ship.recoil[side > 0 ? 1 : 0] = 1;
  for (let i = 0; i < count; i++) {
    const along = (count === 1 ? 0 : (i / (count - 1) - 0.5)) * ship.len * 0.6, spread = (Math.random() - 0.5) * (kind === 'chain' ? 0.3 : 0.08);
    const px = ship.x + fx * along + nx * ship.len * 0.17, py = ship.y + fy * along + ny * ship.len * 0.17, dx = nx + fx * spread, dy = ny + fy * spread;
    G.balls.push({ x:px, y:py, vx:dx * speed + fx * ship.v * 0.6, vy:dy * speed + fy * ship.v * 0.6, life, max:life, dmg, foe, h:0, kind, trail:[] });
    for (let k = 0; k < 7; k++) G.parts.push({ x:px + nx * 8, y:py + ny * 8, vx:(nx + (Math.random() - 0.5) * 0.7) * (50 + Math.random() * 90), vy:(ny + (Math.random() - 0.5) * 0.7) * (50 + Math.random() * 90), t:0.8 + Math.random() * 0.7, max:1.5, col:'smoke', size:7 + Math.random() * 9 });
    G.fx.push({ x:px + nx * 12, y:py + ny * 12, flash:true, t:0.09, a:Math.atan2(ny, nx), big: kind !== 'ball' });
  }
}
function fire(side, kind = 'ball') {
  const me = G.me, i = side > 0 ? 1 : 0;
  if (G.shop || G.over) return false;
  if (kind === 'ball') { if (me.cd[i] > 0) return false; me.cd[i] = stat.reload(); }
  const dmg = stat.dmg() * (kind === 'chain' ? 0.6 : kind === 'fire' ? 0.7 : 1);
  broadside(me, side, stat.guns(), dmg, 540, 0.75 * stat.range(), false, kind);
  SFX.boom(stat.guns()); if (kind === 'chain') SFX.chain(); if (kind === 'fire') SFX.fire();
  shake(5 + stat.guns());
  // 반동: 화면이 쏜 반대쪽으로 살짝 튐 + 배가 밀림
  const nx = -Math.sin(me.a) * side, ny = Math.cos(me.a) * side;
  kick.x -= nx * 9; kick.y -= ny * 9; me.x -= nx * 4; me.y -= ny * 4;
  return true;
}
function useSkill(k) {
  const me = G.me;
  if (!G.up[k] || me.sk[k] > 0 || G.shop || G.over) { SFX.deny(); return; }
  me.sk[k] = SKILLS[k].cd;
  if (k === 'mortar') { const wx = mouse.x + cam.x, wy = mouse.y + cam.y; G.shells.push({ x0:me.x, y0:me.y, x:wx, y:wy, t:0.9, dur:0.9, dmg:60 + G.up.power * 8, r:110, foe:false }); SFX.whistle(); shake(4); return; }
  fire(sideToward(), k);
}
const shake = n => { shakeAmt = Math.max(shakeAmt, n); };
function burst(x, y, col, n, sp = 160, size = 4, life = 0.8) { for (let i = 0; i < n; i++) { const a = Math.random() * 7, v = sp * (0.3 + Math.random()); G.parts.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, t:life * (0.5 + Math.random() * 0.6), max:life, col, size:size * (0.5 + Math.random()) }); } }
function splashAt(x, y, big) { G.fx.push({ x, y, splash:true, t:big ? 0.8 : 0.55, big }); burst(x, y, '#e6f4ff', big ? 18 : 8, big ? 160 : 90, 3); if (Math.random() < 0.35 || big) SFX.splash(); }
function damageShip(s, dmg, isMe, opt = {}) {
  let crit = false;
  if (!isMe && opt.canCrit && Math.random() < stat.crit()) { dmg *= 2; crit = true; }
  s.hp -= dmg; s.hit = 0.22;
  if (!isMe) { G.combo++; G.comboT = 2.5; G.best = Math.max(G.best, G.combo); }
  G.fx.push({ x:s.x + (Math.random() - 0.5) * 20, y:s.y - 20, txt: crit ? `치명타! ${Math.round(dmg)}` : '-' + Math.round(dmg), col: isMe ? '#ff6b5b' : crit ? '#ffb347' : '#ffe27a', t: crit ? 1.1 : 0.8, crit });
  burst(s.x, s.y, '#8a5a30', crit ? 22 : 10, crit ? 260 : 180, 5); // 나무 파편
  if (crit) { burst(s.x, s.y, '#ffb347', 16, 220, 4); SFX.crit(); shake(14); hitStop = 0.07; }
  if (isMe) { shake(11); SFX.hit(); kick.x += (Math.random() - 0.5) * 14; kick.y += (Math.random() - 0.5) * 14; }
}

// ── 업데이트 ──
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
function steer(s, tx, ty, dt, speedFrac = 1, angOff = 0) {
  const want = Math.atan2(ty - s.y, tx - s.x) + angOff, d = wrapA(want - s.a), slow = s.slow > 0 ? 0.45 : 1;
  s.a += Math.sign(d) * Math.min(Math.abs(d), s.turn * dt * slow);
  s.v += (s.speed * speedFrac * slow - s.v) * Math.min(1, dt * 1.5);
}
function collideIslands(s, r) {
  for (const o of G.islands) { const dx = s.x - o.x, dy = s.y - o.y, d = Math.hypot(dx, dy), m = o.r + r; if (d < m) { s.x = o.x + dx / d * m; s.y = o.y + dy / d * m; s.v *= 0.5; } }
  s.x = Math.max(r, Math.min(WORLD.w - r, s.x)); s.y = Math.max(r, Math.min(WORLD.h - r, s.y));
}
function wakeOf(s) { // 뱃머리 물살: 양쪽으로 갈라지는 V자
  if (Math.abs(s.v) < 30) return;
  const fx = Math.cos(s.a), fy = Math.sin(s.a), bx = s.x + fx * s.len * 0.45, by = s.y + fy * s.len * 0.45;
  for (const sd of [-1, 1]) G.parts.push({ x:bx, y:by, vx:-fy * sd * 40 - fx * 10, vy:fx * sd * 40 - fy * 10, t:1.6, max:1.6, col:'wake', size:3 + s.len * 0.04 });
}
function update(dt) {
  G.t += dt;
  const me = G.me;
  // 조작: 돛은 빠르게 반응, 회전은 각속도에 관성 (속도가 빠를수록 큰 원)
  if (keys.w) me.sail = Math.min(1, me.sail + dt * 1.4);
  if (keys.s) me.sail = Math.max(-0.3, me.sail - dt * 1.4);
  const turn = (keys.d ? 1 : 0) - (keys.a ? 1 : 0), tr = stat.turn() * (1.15 - Math.min(0.5, Math.abs(me.v) / 500));
  me.av += (turn * tr - me.av) * Math.min(1, dt * 6);
  me.a += me.av * dt;
  me.v += (stat.speed() * me.sail - me.v) * Math.min(1, dt * 1.3);
  me.x += Math.cos(me.a) * me.v * dt; me.y += Math.sin(me.a) * me.v * dt;
  collideIslands(me, me.len * 0.33);
  me.cd = me.cd.map(c => Math.max(0, c - dt)); me.hit = Math.max(0, me.hit - dt); me.recoil = me.recoil.map(r => Math.max(0, r - dt * 4));
  for (const k in me.sk) me.sk[k] = Math.max(0, me.sk[k] - dt);
  if (Math.random() < dt * 40) wakeOf(me);
  // 누르고 있으면 장전되는 대로 연사
  if (mouse.down) fire(sideToward());
  if (keys.q) fire(-1); if (keys.e) fire(1);
  // 콤보
  if ((G.comboT -= dt) <= 0) G.combo = 0;
  // 적
  for (const f of G.foes) {
    const dx = me.x - f.x, dy = me.y - f.y, dist = Math.hypot(dx, dy);
    f.cd = f.cd.map(c => c - dt); f.hit = Math.max(0, f.hit - dt); f.bob += dt; f.slow = Math.max(0, f.slow - dt); f.recoil = f.recoil.map(r => Math.max(0, r - dt * 4));
    if (f.burn > 0) { f.burn -= dt; f.hp -= 7 * dt; if (Math.random() < dt * 18) G.parts.push({ x:f.x + (Math.random() - 0.5) * f.len * 0.5, y:f.y + (Math.random() - 0.5) * f.len * 0.2, vx:(Math.random() - 0.5) * 20, vy:-30 - Math.random() * 30, t:0.6, max:0.6, col:'flame', size:6 + Math.random() * 6 }); }
    if (f.k === 'mine') { f.x += Math.cos(f.bob * 0.3) * 8 * dt; f.y += Math.sin(f.bob * 0.4) * 8 * dt; if (dist < f.len + me.len * 0.33) { damageShip(me, f.boom, true); f.hp = 0; f.exploded = true; } continue; }
    if (f.k === 'speeder') { steer(f, me.x, me.y, dt); if (dist < f.len * 0.5 + me.len * 0.33) { damageShip(me, f.ram, true); f.hp = 0; f.exploded = true; } }
    else if (f.k === 'shark') { steer(f, me.x, me.y, dt, 1, dist > 160 ? 0 : 1.2); if (dist < 60 && f.cd[0] <= 0) { damageShip(me, f.bite, true); f.cd[0] = 1.2; burst(me.x, me.y, '#cfe8ff', 10, 120); } }
    else if (f.mortar) {

  const hot = inR(mouse, NEXT_BTN); ctx.fillStyle = hot ? '#3a7a3a' : '#2a5a2a'; ctx.fillRect(NEXT_BTN.x, NEXT_BTN.y, NEXT_BTN.w, NEXT_BTN.h); ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 2; ctx.strokeRect(NEXT_BTN.x, NEXT_BTN.y, NEXT_BTN.w, NEXT_BTN.h);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`⚓ 웨이브 ${G.wave + 1} 출항`, VW/2, NEXT_BTN.y + 33);
}
const inR = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function buy(k) {
  const U = UPGS[k], lv = G.up[k], cost = U.cost(lv);
  if (lv >= U.max || G.gold < cost) return false;
  G.gold -= cost; G.up[k]++; SFX.buy();
  if (k === 'hull') { G.me.max += 30; G.me.hp += 30; }
  return true;
}

// ── 입력 ──
const pos = e => { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * VW / r.width, y:(e.clientY - r.top) * VH / r.height }; };
const audio = () => { if (!AC) { try { AC = new AudioContext(); } catch (err) {} } };
cv.onmousemove = e => { const p = pos(e); mouse.x = p.x; mouse.y = p.y; };
cv.onmousedown = e => {
  audio(); const p = pos(e); mouse.x = p.x; mouse.y = p.y;
  if (G.over) { newGame(); return; }
  if (G.shop) { Object.keys(UPGS).forEach((k, i) => { if (inR(p, shopRect(i)) && !buy(k)) SFX.deny(); }); if (inR(p, NEXT_BTN)) nextWave(); return; }
  if (e.button === 0) mouse.down = true;
};
addEventListener('mouseup', () => { mouse.down = false; });
cv.oncontextmenu = e => e.preventDefault();
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true; audio();
  if (k === ' ') { e.preventDefault(); fire(1); fire(-1); }
  if (k === '1') useSkill('chain'); if (k === '2') useSkill('fireb'); if (k === '3') useSkill('mortar');
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ── 루프: 맞는 순간 멈칫(hitStop), 보스 격침·침몰 때 슬로모션 ──
let last = performance.now();
function loop(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  if (hitStop > 0) hitStop -= real;
  else {
    const dt = real * (slowMo > 0 ? 0.3 : 1); if (slowMo > 0) slowMo -= real;
    if (!G.over && !G.shop) update(dt);
    else { for (const p of G.parts) p.t -= dt; G.parts = G.parts.filter(p => p.t > 0); for (const f of G.fx) f.t -= dt; G.fx = G.fx.filter(f => f.t > 0); }
  }
  shakeAmt *= Math.pow(0.003, real); kick.x *= Math.pow(0.0005, real); kick.y *= Math.pow(0.0005, real);
  draw();
  requestAnimationFrame(loop);
}
newGame();
requestAnimationFrame(loop);
</script>
